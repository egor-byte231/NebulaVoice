name: Cloudflare worker validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-deploy.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --input-type=module --check < cloudflare/worker.js
      - run: npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
